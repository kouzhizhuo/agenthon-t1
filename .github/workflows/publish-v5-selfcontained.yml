# SPDX-License-Identifier: Apache-2.0
name: T1 V16 segmented publish and verify exact final digest
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Materialize exact frozen V16 source and verify every file
        run: |
          mkdir -p candidate
          python3 - <<'PYCODE'
          import base64,hashlib,io,json,stat,tarfile
          from pathlib import Path,PurePosixPath
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='63598cdd077138cdc6672be542e2be62dbfe4c845c48efb2e994bf99f7cf63cc'
          descriptor=json.loads(base64.b64decode('',validate=True))
          assert descriptor['source_commit']=='972ba1b1a8189b56197cc1b4937c6f4771e5bea5'
          assert descriptor['bundle_sha256']==hashlib.sha256(raw).hexdigest()
          expected={row['path']:row for row in descriptor['files']}
          assert len(expected)==65
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              members=archive.getmembers()
              assert len(members)==len(expected) and len({member.name for member in members})==len(members)
              for member in members:
                  path=PurePosixPath(member.name)
                  assert member.isfile() and member.name in expected and not path.is_absolute()
                  assert path.as_posix()==member.name and '..' not in path.parts
                  assert not any(part.startswith('._') or part in ('__pycache__','.git','artifacts') for part in path.parts)
                  assert member.mode==0o444 and member.uid==member.gid==0 and member.mtime==0
                  data=archive.extractfile(member).read()
                  assert len(data)==expected[member.name]['bytes']
                  assert hashlib.sha256(data).hexdigest()==expected[member.name]['sha256']
              archive.extractall('candidate',filter='data')
          actual={path.relative_to('candidate').as_posix():path for path in Path('candidate').rglob('*') if path.is_file()}
          assert actual.keys()==expected.keys()
          for name,path in actual.items():
              assert not path.is_symlink() and path.stat().st_size==expected[name]['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected[name]['sha256']
          Path('candidate/artifacts').mkdir()
          Path('candidate/artifacts/source-freeze.json').write_text(json.dumps(descriptor,indent=2)+'\n')
          PYCODE
      - name: Materialize V16 release-only tag verifier adapter
        run: |
          cd candidate
          python3 - <<'PY_ADAPTER'
          import base64,hashlib
          from pathlib import Path
          original=Path('verification/verify_anonymous_registry.py').read_bytes()
          assert hashlib.sha256(original).hexdigest()=='9feae7e51fae90c068d3f8a1f6f2186f5de571ca571c772f5c9daa042526e6ad'
          adapted=base64.b64decode('',validate=True)
          assert hashlib.sha256(adapted).hexdigest()=='f16890449550eb6c42f9d0f341533b08bbd48310b35e6c87960ef5ff9ebe64f8'
          expected=original.decode().replace('segmented-v10-','segmented-v16-').replace('segmented V10 run tag','segmented V16 run tag').encode()
          assert adapted==expected
          Path('artifacts/verify_anonymous_registry_v16.py').write_bytes(adapted)
          PY_ADAPTER
      - name: Build and validate final frozen production source
        run: |
          cd candidate
          mkdir -p artifacts
          docker build --platform linux/amd64 --network none --pull=false -t t1-task-first:candidate . > artifacts/build.txt 2>&1
          docker image inspect t1-task-first:candidate > artifacts/image-inspect.json
          python3 verification/verify_image.py artifacts/image-inspect.json > artifacts/image-contract.json
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" --entrypoint python t1-task-first:candidate -B /verification/verify_runtime.py > artifacts/runtime.json 2>&1
      - name: Publish exact verified production candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd candidate
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/kouzhizhuo/agenthon-t1:segmented-v16-${GITHUB_RUN_ID}"
          docker tag t1-task-first:candidate "$IMAGE"
          docker push "$IMAGE" > artifacts/push.txt 2>&1
          docker image inspect "$IMAGE" --format '{{join .RepoDigests "\n"}}' > artifacts/published-image.txt
          python3 - <<'PY_DIGEST'
          import re
          from pathlib import Path
          raw=Path('artifacts/published-image.txt').read_bytes()
          match=re.fullmatch(rb'ghcr\.io/kouzhizhuo/agenthon-t1@(sha256:[0-9a-f]{64})\n',raw)
          assert match is not None, 'expected one exact immutable T1 repository digest'
          Path('artifacts/image.digest').write_bytes(match.group(1)+b'\n')
          PY_DIGEST
          docker logout ghcr.io
      - name: Pull and validate exact digest anonymously
        run: |
          cd candidate
          DIGEST="$(cat artifacts/image.digest)"
          python3 -B artifacts/verify_anonymous_registry_v16.py "$DIGEST" --tag "segmented-v16-${GITHUB_RUN_ID}" > artifacts/anonymous-registry.json
          mkdir -p artifacts/anonymous-docker-config
          IMAGE="ghcr.io/kouzhizhuo/agenthon-t1@$(cat artifacts/image.digest)"
          DOCKER_CONFIG="$PWD/artifacts/anonymous-docker-config" docker pull --platform linux/amd64 "$IMAGE" > artifacts/anonymous-pull.txt 2>&1
          docker image inspect "$IMAGE" > artifacts/anonymous-image-inspect.json
          python3 verification/verify_image.py artifacts/anonymous-image-inspect.json > artifacts/anonymous-image-contract.json
          python3 - <<'PY_ID'
          import json
          from pathlib import Path
          built=json.loads(Path('artifacts/image-inspect.json').read_text())
          pulled=json.loads(Path('artifacts/anonymous-image-inspect.json').read_text())
          receipt=json.loads(Path('artifacts/anonymous-registry.json').read_text())
          reference=Path('artifacts/published-image.txt').read_text().strip()
          digest=Path('artifacts/image.digest').read_text().strip()
          assert len(built)==len(pulled)==1
          assert built[0]['Id']==pulled[0]['Id']
          assert reference in pulled[0]['RepoDigests']
          assert receipt['status']=='PASS' and receipt['repository']=='ghcr.io/kouzhizhuo/agenthon-t1'
          assert receipt['requested_digest']==receipt['selected_manifest_digest']==digest
          assert receipt['anonymous_full_blob_download_verified'] is True
          assert receipt['registry_credentials_read'] is False and receipt['downloaded_content_written'] is False
          configs=[entry for entry in receipt['blobs'] if entry['kind']=='config']
          assert len(configs)==1 and configs[0]['digest']==built[0]['Id']
          assert all(entry['download_sha256']==entry['digest'] for entry in receipt['blobs'])
          assert receipt['blob_count']==len(receipt['blobs'])
          assert receipt['platform']=={'os':'linux','architecture':'amd64'}
          assert json.loads(Path('artifacts/image-contract.json').read_text())==json.loads(Path('artifacts/anonymous-image-contract.json').read_text())
          PY_ID
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" --entrypoint python "$IMAGE" -B /verification/verify_runtime.py > artifacts/anonymous-runtime.json 2>&1
      - name: Production CLI on anonymous immutable digest and readonly input
        run: |
          cd candidate
          IMAGE="ghcr.io/kouzhizhuo/agenthon-t1@$(cat artifacts/image.digest)"
          python3 verification/production_smoke.py prepare --task-dir artifacts/smoke-input
          mkdir -p artifacts/smoke-output
          chmod -R a+rX artifacts/smoke-input
          chmod 0777 artifacts/smoke-output
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" -v "$PWD/artifacts/smoke-input:/input:ro" -v "$PWD/artifacts/smoke-output:/app/output:rw" --entrypoint python "$IMAGE" -B /verification/production_smoke.py run > artifacts/production-smoke.json 2>&1
      - name: Complete regression on actual published digest
        run: |
          cd candidate
          mkdir -p artifacts/test-context
          IMAGE="ghcr.io/kouzhizhuo/agenthon-t1@$(cat artifacts/image.digest)"
          python3 - "$IMAGE" <<'PY_TEST'
          import sys
          from pathlib import Path
          text=Path('verification/Test.Dockerfile').read_text()
          assert '\nFROM t1-task-first:candidate\n' in text
          Path('artifacts/test-context/Dockerfile').write_text(text.replace('\nFROM t1-task-first:candidate\n','\nFROM '+sys.argv[1]+'\n'))
          PY_TEST
          cp -r tests artifacts/test-context/tests
          docker build --network none --pull=false -t t1-task-first:release-tests artifacts/test-context > artifacts/test-build.txt 2>&1
          timeout --kill-after=5s 300s docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --entrypoint python t1-task-first:release-tests -B -m unittest discover -s /agent/tests -v > artifacts/test-linux.txt 2>&1
      - name: Require exact frozen test identities and zero skips
        run: |
          cd candidate
          python3 - <<'PY_ROSTER'
          import ast,hashlib,json,re
          from pathlib import Path
          descriptor=json.loads(Path('artifacts/source-freeze.json').read_text())
          expected=[]
          for path in sorted(Path('tests').glob('test_*.py')):
              for cls in ast.parse(path.read_text()).body:
                  if isinstance(cls,ast.ClassDef):
                      expected.extend(path.stem+'.'+cls.name+'.'+fn.name for fn in cls.body
                          if isinstance(fn,ast.FunctionDef) and fn.name.startswith('test_'))
          assert len(expected)==len(set(expected))==250
          assert sorted(expected)==descriptor['test_roster']
          assert hashlib.sha256('\n'.join(sorted(expected)).encode()).hexdigest()==descriptor['test_roster_sha256']
          log=Path('artifacts/test-linux.txt').read_text()
          passed=re.findall(r'^test_\w+ \(([^)]+)\) \.\.\. ok$',log,re.M)
          assert len(passed)==len(set(passed))==250 and set(passed)==set(expected)
          assert re.search(r'\nRan 250 tests in [0-9.]+s\n\nOK\n\s*\Z',log)
          assert 'skipped' not in log
          Path('artifacts/test-roster-verified.txt').write_text('250 exact frozen identities; zero skips\n')
          PY_ROSTER
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-publish-final-v16-${{ github.run_id }}
          path: candidate/artifacts/
