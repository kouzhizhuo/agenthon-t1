name: T3 fallback matrix on a real amd64 runner (v10m, anonymous pull by digest, official flags)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/fallbackmatrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST_V10M: sha256:364bd2574c86fb79f3956872d627a080b5573e3bfacee33ccef6edd2c4c81e86
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - run: python -m pip install numpy pyarrow
      - name: Fallback matrix (routed sample, crash parity, batch abort)
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/fallback_check.py --image "$IMAGE" --out "$PWD/evidence/fallback.json" --digest v10mm="$DIGEST_V10M=matrix" || true
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-fallback-matrix
          path: evidence
          retention-days: 30
          if-no-files-found: error
