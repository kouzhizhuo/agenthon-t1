name: T3 fallback matrix on a real amd64 runner (v11m, anonymous pull by digest, official flags)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/fallbackmatrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST_V11M: sha256:c694767d68a60f2ed2e8eb22037ab52d8aa42c26ceb8e63fb1cf8df498bb41cf
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'
      - run: python -m pip install numpy pyarrow
      - name: Fallback matrix (routed sample, crash parity, batch abort)
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/fallback_check.py --image "$IMAGE" --out "$PWD/evidence/fallback.json" --digest v11mm="$DIGEST_V11M=matrix" || true
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t3-fallback-matrix
          path: |
            evidence/*.json
            evidence/*/*.json
            evidence/*.md
            evidence/*/*.md
            evidence/*.txt
            evidence/*/*.txt
          retention-days: 30
          if-no-files-found: error
