# SPDX-License-Identifier: Apache-2.0
name: T1 task-first V4 build test and publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image for an authorized Development trial
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materialize frozen reviewed source
        run: |
          python3 - <<'PY_SOURCE'
          import base64,gzip,json,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='6efa144d82b464783e55ad85351eb448b2ccbfdac110a3885033942cdf08ab64'
          for name,source in json.loads(raw).items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(source)
          PY_SOURCE
      - name: Build pinned production image
        run: |
          mkdir -p artifacts
          docker build --platform linux/amd64 --network none --pull=false -t t1-task-first:candidate . > artifacts/build.txt 2>&1
          docker image inspect t1-task-first:candidate > artifacts/image-inspect.json
          python3 verification/verify_image.py artifacts/image-inspect.json > artifacts/image-contract.json
      - name: Verify installed Python3.13 source and numerical integration
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" --entrypoint python t1-task-first:candidate -B /verification/verify_runtime.py > artifacts/runtime.json 2>&1
      - name: Real HTTP and child-process regressions in production dependencies
        run: |
          mkdir -p artifacts/test-context
          cp verification/Test.Dockerfile artifacts/test-context/Dockerfile
          cp -r tests artifacts/test-context/tests
          docker build --network none --pull=false -t t1-task-first:tests artifacts/test-context > artifacts/test-build.txt 2>&1
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --entrypoint python t1-task-first:tests -B -m unittest discover -s /agent/tests -v > artifacts/test-linux.txt 2>&1
      - name: Publish the same verified production image
        if: inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/kouzhizhuo/agenthon-t1:independent-v4-${GITHUB_RUN_ID}"
          docker tag t1-task-first:candidate "$IMAGE"
          docker push "$IMAGE" > artifacts/push.txt 2>&1
          docker image inspect "$IMAGE" --format '{{join .RepoDigests "\n"}}' > artifacts/published-image.txt
          sed -n 's/^.*@\(sha256:[0-9a-f]*\)$/\1/p' artifacts/published-image.txt > artifacts/image.digest
          test "$(wc -l < artifacts/image.digest)" -eq 1
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-independent-v4-${{ github.run_id }}
          path: artifacts/
