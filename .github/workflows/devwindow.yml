name: Dev-window proxy (docker create -> start -> wait -> rm) on a real amd64 runner
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/devwindow.yml
      - t3devwindow/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devwindow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Measure
        run: |
          set -uo pipefail
          mkdir -p evidence
          { uname -a; lscpu | head -20; free -m; docker version --format '{{.Server.Version}}'; docker info 2>&1 | head -40; } > evidence/host.txt 2>&1
          python3 t3devwindow/devwindow.py --raw-base "https://raw.githubusercontent.com/Agenthon-2026/track3-simulation-public/1d7e994761f2e9256dd0c572c3592422c8fd0914" --out "$PWD/evidence/devwindow.json" --n 10
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-devwindow-evidence
          path: evidence
          retention-days: 30
          if-no-files-found: error
