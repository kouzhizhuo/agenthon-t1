name: Verify T3 fastsim image on Linux (anonymous pull by digest, official flags)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/verify-t3-fastsim.yml
      - t3fastsim_verify/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST_V6: sha256:f1b588aadad1eb3112a3b258f8ffc6289116e2ee29a47047d230fa47b424f327
      DIGEST_V7S: sha256:5af9915b43a326486939a6ad44661322b59e92c96d776c12740b1eca92d5aa36
      DIGEST_V7F: sha256:bde35f172b1072f52f9957d0e8430d0e6e03736c9724e9ba5a3304ee42df6a7a
      TRACK_REPO: https://github.com/Agenthon-2026/track3-simulation-public.git
      TRACK_COMMIT: 1d7e994761f2e9256dd0c572c3592422c8fd0914
      TOOLKIT_TAG: v2.5.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13 (scorer environment)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Clone the public track repo at the pinned commit and fetch only the needed reference objects (Git LFS)
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet "$TRACK_REPO" track
          git -C track checkout --quiet "$TRACK_COMMIT"
          git -C track rev-parse HEAD
          cd track
          git lfs install --local
          git lfs pull --include="units/**"
          du -sh units; ls -la units/t3-gb-mega-throughput units/t3-gbatch-dense-3/checks/reference_data/sub_00
      - name: Install the pinned scorer (toolkit and track package, as CI does)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "qfbench2-common[data] @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${TOOLKIT_TAG}#subdirectory=common"
          python -m pip install ./track
          python -m pip install polars fastparquet
          python -c "import importlib.metadata as m;print(m.version('qfbench2-common'), m.version('qfbench2-track-simulation'))"
      - name: Stress (crash counts, byte stability) on v7s and v7f
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/stress.py --image "$IMAGE" --track "$PWD/track" --out "$PWD/evidence/stress.json" \
            --digest v7s="$DIGEST_V7S" --digest v7f="$DIGEST_V7F" --plan t3-ra02-shock-early=200 t3-as01-base-mix=50 t3-gbatch-hetero-mix=50 || true
      - name: A/B (v6, v7s, v7f, v6) anonymous pull + verify, same job back to back
        run: |
          set -euo pipefail
          mkdir -p evidence
          { uname -a; lscpu | head -20; free -m; docker version --format '{{.Server.Version}}'; } > evidence/host.txt 2>&1
          for step in v6a:$DIGEST_V6 v7sa:$DIGEST_V7S v7fa:$DIGEST_V7F v6b:$DIGEST_V6; do
            label=${step%%:*}; dig=${step#*:}
            python t3fastsim_verify/verify.py --image "$IMAGE" --digest "$dig" --track "$PWD/track" --out "$PWD/evidence/$label" --units all --runs 3 --platform linux/amd64 --fastparquet-informational --work "$RUNNER_TEMP/t3v_$label" || true
          done
      - name: Annotations v6a
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v6a v6a
      - name: Annotations v7sa
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v7sa v7sa
      - name: Annotations v7fa
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v7fa v7fa
      - name: Annotations v6b
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v6b v6b
      - name: Annotations A/B summary
        if: always()
        run: python t3fastsim_verify/ab_summary.py v6=evidence/v6a,evidence/v6b v7s=evidence/v7sa v7f=evidence/v7fa
      - name: Summary
        if: always()
        run: |
          for d in v6a v7sa v7fa v6b; do if [ -f evidence/$d/summary.md ]; then echo "## $d" >> "$GITHUB_STEP_SUMMARY"; cat evidence/$d/summary.md >> "$GITHUB_STEP_SUMMARY"; fi; done
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-fastsim-linux-evidence
          path: |
            evidence/*/report.json
            evidence/*/summary.md
            evidence/host.txt
            evidence/stress.json
            evidence/*/gate
          retention-days: 30
          if-no-files-found: error
