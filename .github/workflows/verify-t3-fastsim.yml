name: Verify T3 fastsim image on Linux (anonymous pull by digest, official flags)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/verify-t3-fastsim.yml
      - t3fastsim_verify/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST_V8F: sha256:1149e11c50532c313cd8e297fd30eca9265e5534407f7719d465e529bce962a9
      DIGEST_V9F: sha256:01331787987457f64093c4f0f3caf0ee1b58dbc36a87de9dcdda1b00e2807e26
      DIGEST_V9S: sha256:7ffe91117d005a737e5a24cb0b84d67d7ac6632040c694510c3231196fa2c1d7
      TRACK_REPO: https://github.com/Agenthon-2026/track3-simulation-public.git
      TRACK_COMMIT: 1d7e994761f2e9256dd0c572c3592422c8fd0914
      TOOLKIT_TAG: v2.5.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13 (scorer environment)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Clone the public track repo at the pinned commit and fetch only the needed reference objects (Git LFS)
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet "$TRACK_REPO" track
          git -C track checkout --quiet "$TRACK_COMMIT"
          git -C track rev-parse HEAD
          cd track
          git lfs install --local
          git lfs pull --include="units/**"
          du -sh units; ls -la units/t3-gb-mega-throughput units/t3-gbatch-dense-3/checks/reference_data/sub_00
      - name: Install the pinned scorer (toolkit and track package, as CI does)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "qfbench2-common[data] @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${TOOLKIT_TAG}#subdirectory=common"
          python -m pip install ./track
          python -m pip install polars fastparquet
          python -c "import importlib.metadata as m;print(m.version('qfbench2-common'), m.version('qfbench2-track-simulation'))"
      - name: Stress (crash counts, byte stability) on v9s
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/stress.py --image "$IMAGE" --track "$PWD/track" --out "$PWD/evidence/stress.json" \
            --digest v9s="$DIGEST_V9S" --plan t3-ra02-shock-early=100 t3-as01-base-mix=30 t3-gbatch-hetero-mix=30 || true
      - name: Fallback check on v9s (must exit 3 on unsupported content)
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/fallback_check.py --image "$IMAGE" --out "$PWD/evidence/fallback.json" --digest v9s="$DIGEST_V9S=3" || true
      - name: A/B (v9f, v9s, v9s, v9f) anonymous pull + verify, same job back to back
        run: |
          set -euo pipefail
          mkdir -p evidence
          { uname -a; lscpu | head -20; free -m; docker version --format '{{.Server.Version}}'; } > evidence/host.txt 2>&1
          for step in v9fa:$DIGEST_V9F v9sa:$DIGEST_V9S v9sb:$DIGEST_V9S v9fb:$DIGEST_V9F; do
            label=${step%%:*}; dig=${step#*:}
            codec=""; case $label in v8*|v9*) codec="--expect-codec SNAPPY";; esac
            python t3fastsim_verify/verify.py --image "$IMAGE" --digest "$dig" --track "$PWD/track" --out "$PWD/evidence/$label" --units all --runs 3 --platform linux/amd64 --fastparquet-informational $codec --work "$RUNNER_TEMP/t3v_$label" || true
          done
      - name: Annotations v9fa
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v9fa v9fa short
      - name: Annotations v9sa
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v9sa v9sa 
      - name: Annotations v9sb
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v9sb v9sb 
      - name: Annotations v9fb
        if: always()
        run: python t3fastsim_verify/emit_annotations.py evidence/v9fb v9fb short
      - name: Annotations A/B summary
        if: always()
        run: python t3fastsim_verify/ab_summary.py v9f=evidence/v9fa,evidence/v9fb v9s=evidence/v9sa,evidence/v9sb
      - name: Summary
        if: always()
        run: |
          for d in v9fa v9sa v9sb v9fb; do if [ -f evidence/$d/summary.md ]; then echo "## $d" >> "$GITHUB_STEP_SUMMARY"; cat evidence/$d/summary.md >> "$GITHUB_STEP_SUMMARY"; fi; done
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-fastsim-linux-evidence
          path: |
            evidence/*/report.json
            evidence/*/summary.md
            evidence/host.txt
            evidence/stress.json
            evidence/fallback.json
            evidence/*/gate
          retention-days: 30
          if-no-files-found: error
