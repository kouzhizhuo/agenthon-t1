name: Verify T3 fastsim image on Linux (anonymous pull by digest, official flags)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/verify-t3-fastsim.yml
      - t3fastsim_verify/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST: sha256:eab8997a5073edee8886dc6b4cc735db02676b803c49ab086bbeea8efcfc4686
      TRACK_REPO: https://github.com/Agenthon-2026/track3-simulation-public.git
      TRACK_COMMIT: 1d7e994761f2e9256dd0c572c3592422c8fd0914
      TOOLKIT_TAG: v2.5.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13 (scorer environment)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Clone the public track repo at the pinned commit and fetch only the needed reference objects (Git LFS)
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet "$TRACK_REPO" track
          git -C track checkout --quiet "$TRACK_COMMIT"
          git -C track rev-parse HEAD
          cd track
          git lfs install --local
          git lfs pull --include="units/**"
          du -sh units; ls -la units/t3-gb-mega-throughput units/t3-gbatch-dense-3/checks/reference_data/sub_00
      - name: Install the pinned scorer (toolkit and track package, as CI does)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "qfbench2-common[data] @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${TOOLKIT_TAG}#subdirectory=common"
          python -m pip install ./track
          python -c "import importlib.metadata as m;print(m.version('qfbench2-common'), m.version('qfbench2-track-simulation'))"
      - name: Verify (anonymous pull, official runtime flags, 3 repeats per unit, all 71 units, compare with public references)
        run: |
          set -euo pipefail
          mkdir -p evidence
          { uname -a; lscpu | head -20; free -m; docker version --format '{{.Server.Version}}'; } > evidence/host.txt 2>&1
          python t3fastsim_verify/verify.py --image "$IMAGE" --digest "$DIGEST" --track "$PWD/track" --out "$PWD/evidence" --units all --runs 3 --platform linux/amd64 --work "$RUNNER_TEMP/t3v"
      - name: Emit results as public annotations (job logs and artifacts need a login; annotations do not)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("evidence/report.json")
          if not p.exists():
              print("::error title=T3V::no evidence/report.json"); raise SystemExit
          r = json.loads(p.read_text())
          def n(msg): print("::notice title=T3V::" + msg.replace("%", "%25").replace("\r", "").replace("\n", " | "))
          pl = r.get("pull") or {}
          n("IMAGE " + r["image"] + " id " + r["image_inspect"]["id"] + " " + r["image_inspect"]["os"] + "/" + r["image_inspect"]["arch"] + " labels " + json.dumps(r["image_inspect"]["labels"]) + " volumes " + str(r["image_inspect"]["volumes"])
            + " ; ANON PULL rc=" + str(pl.get("rc")) + " in " + str(pl.get("seconds")) + "s anonymous=" + str(pl.get("anonymous"))
            + " ; HOST " + r["host"]["uname"] + " nproc=" + str(r["host"]["nproc"]) + " docker=" + r["host"]["docker"] + " load1 " + str(round(r["host"]["loadavg_start"][0], 2)) + "->" + str(round(r["host"]["loadavg_end"][0], 2))
            + " ; ALPINE_TRUE_WINDOW_MEDIAN_S " + str(round(r["alpine_true_window_median_s"], 4)))
          rows = []
          for u in r["units"]:
              rows.append("%s %s %.4f %.0f ex=%s by=%s rp=%s f=%s" % (u["unit"].replace("t3-", ""), u.get("n_events"), u["window_median_s"], u.get("events_per_s_window", 0),
                          int(bool(u.get("exact_vs_public_reference"))), u.get("byte_identical_to_public_reference"), int(bool(u.get("repeat_files_byte_identical"))), u["n_failed"]))
          K = 12
          for i in range(0, len(rows), K):
              n("UNITS[%d-%d] (name events window_s events_per_s exact bytes_eq_public repeat_bytes_equal failed_runs): " % (i + 1, min(i + K, len(rows))) + " ; ".join(rows[i:i + K]))
          ro = r.get("roster", {})
          n("roster_mean_events_per_s=%.0f total_window_s=%.3f n_units=%s n_exact=%s n_failed_runs=%s non_exact=%s" % (ro.get("roster_mean_events_per_s", 0), ro.get("total_window_s", 0), ro.get("n_units"), ro.get("n_exact"), ro.get("n_failed_runs"), ro.get("non_exact")))
          g = r.get("gate_current", "")
          rows = [ln.split()[0] + ":" + ln.split()[1] for ln in g.splitlines() if ln.startswith("t3-")]
          n("GATE_CURRENT " + (g.strip().splitlines()[-1] if g.strip() else "none") + " ; " + " ".join(rows))
          PY
      - name: Summary
        if: always()
        run: |
          if [ -f evidence/summary.md ]; then cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-fastsim-linux-evidence
          path: |
            evidence/report.json
            evidence/summary.md
            evidence/host.txt
            evidence/gate
          retention-days: 30
          if-no-files-found: error
