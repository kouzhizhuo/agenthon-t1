zvK6;eE<5~+p0|HI%#FEjXb;8wj)p`dmxP>a>EJ)A^ZT@)we<206O5iK+C$wJ8+xyK&6<?+Qhh2M~_72?xyw`@T0)$*s!62*@HF#lLJHr1pri>PA{;5cl4aF6Z)vnw_P7(aM%tmvh05Bbg-Muxpe|jm2A0PAi3~AK+!e|k3A5ifgHwd&=oBZ!9a+f`Jmj#KvDal+jCtQm23JvR5QD5KE+4f2^hOpid3WK*a`Y=koas+yd9tkAP_~kfS}fO(OPT4RySSHU4VdCNJDx!jBaEHv770&%;=|xyzSHoV3YJ<)_vGZ?RGl^L8R9K8qw_n68Av(>2~{WI79vnT*Hh&EOPPe1QeY<2;#4vpP&CfLGOc{8|VlC')
          assert len(packed)==169864 and hashlib.sha256(packed).hexdigest()=='a885bde16ac46ae30d4de9604ea9cd855501199a5eed84e2e39c21786cc8a788'
          decoder=zlib.decompressobj(16+zlib.MAX_WBITS)
          raw=decoder.decompress(packed,583707+1)
          assert len(raw)==583707 and decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert hashlib.sha256(raw).hexdigest()=='7081ecc70537f06f870c4e448a362211540a8c5d5741a7ea940025048b78afbc'
          def pairs(items):
              result={}
              for key,value in items:
                  if key in result:raise ValueError('duplicate payload key')
                  result[key]=value
              return result
          bundle=json.loads(raw,object_pairs_hook=pairs)
          assert len(bundle['files'])==37 and set(bundle['files'])==set(bundle['inventory'])
          root=Path('bundle');root.mkdir()
          for name,text in bundle['files'].items():
              relative=PurePosixPath(name)
              assert not relative.is_absolute() and str(relative)==name and '..' not in relative.parts
              assert not any(x.startswith('._') for x in relative.parts)
              body=text.encode();row=bundle['inventory'][name]
              assert len(body)==row['bytes'] and hashlib.sha256(body).hexdigest()==row['sha256']
              path=root.joinpath(*relative.parts);path.parent.mkdir(parents=True,exist_ok=True)
              with path.open('xb') as stream:stream.write(body)
          for p in (root/'verification').rglob('*'):p.chmod(0o555 if p.is_dir() else 0o444)
          (root/'verification').chmod(0o555)
          Path('ROOT_DISPATCH_ATTESTATION.json').write_text(json.dumps({
              'workflow_review_sha256':os.environ['WORKFLOW_REVIEW_SHA256'],
              'candidate_source_freeze_sha256':'011aaf293641b4123c021085700b1def95cdb9415427be457fecade1bfea8d39',
              'digest_shape_is_authorization':False,'root_verified_one_shot_gate_required':True,
              'production_budget_seconds':470,'effective_agent_seconds':399.5,'request_timeout_seconds':240})+'\n')
          PY_BUNDLE
      - name: Build exact candidate preserving published audit3000 dependencies
        run: |
          set -euo pipefail
          mkdir anonymous-docker-config
          export DOCKER_CONFIG="$PWD/anonymous-docker-config"
          timeout --kill-after=10s 300s docker pull "$BASE_IMAGE" > base-pull.txt
          timeout --kill-after=10s 300s docker build --network none --platform linux/amd64 --pull=false --tag t1-reachable:candidate bundle > build.txt
          docker image inspect t1-reachable:candidate > candidate-image-inspect.json
          python3 -I -S -B bundle/verification/verify_installed.py --image candidate-image-inspect.json > candidate-config-receipt.json
          python3 -I -S -B - <<'PY_ID'
          import json
          from pathlib import Path
          Path('CANDIDATE_IMAGE_ID.txt').write_text(json.loads(Path('candidate-config-receipt.json').read_bytes())['image_id']+'\n')
          PY_ID
      - name: Verify real installed imports and numerical integration
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          timeout --kill-after=5s 60s docker run --rm --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/bundle/verification:/verification:ro" --entrypoint python "$IMAGE_ID" -I -B /verification/verify_installed.py > installed-source-runtime.json
      - name: Full23 actual CLI and three fresh numeric production solve processes
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          SMOKE_NAME="t1-reachable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir smoke-output
          chmod 0777 smoke-output
          trap 'timeout --kill-after=5s 30s docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true' EXIT
          docker create --name "$SMOKE_NAME" --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/bundle/verification:/verification:ro" -v "$PWD/smoke-output:/output:rw" --entrypoint python "$IMAGE_ID" -I -B /verification/supervise.py --out /output/mechanics > smoke-container-id.txt
          timeout --kill-after=5s 200s docker start -a "$SMOKE_NAME" > smoke-container-stdout.txt 2> smoke-container-stderr.txt
          docker inspect "$SMOKE_NAME" > smoke-container-inspect.json
          sudo python3 -I -S -B "$PWD/bundle/verification/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase success --container-name "$SMOKE_NAME"
          python3 -I -S -B bundle/verification/verify_controls.py --output smoke-output/mechanics --container smoke-container-inspect.json --image-id "$IMAGE_ID" > smoke-summary.json
          cat smoke-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only the same completely verified image when authorized
        if: ${{ inputs.publish_candidate }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY_GATE'
          import json
          from pathlib import Path
          image=Path('CANDIDATE_IMAGE_ID.txt').read_text().strip()
          assert json.loads(Path('candidate-config-receipt.json').read_bytes())['image_id']==image
          assert json.loads(Path('installed-source-runtime.json').read_bytes())['status']=='PASS_ACTUAL_INSTALLED24_NUMERIC_INTEGRATION'
          smoke=json.loads(Path('smoke-summary.json').read_bytes())
          assert smoke['status']=='PASS_ACTUAL_INSTALLED24_NUMERICS_FULL23_388_CLI3_SETTLEMENT' and smoke['image_id']==image
          PY_GATE
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u kouzhizhuo --password-stdin
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          TAG="budget-reachable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$IMAGE_ID" "ghcr.io/kouzhizhuo/agenthon-t1:$TAG"
          timeout --kill-after=10s 300s docker push "ghcr.io/kouzhizhuo/agenthon-t1:$TAG" > registry-push.txt
          docker image inspect "ghcr.io/kouzhizhuo/agenthon-t1:$TAG" > published-image-inspect.json
          python3 -I -S -B - <<'PY_PUBLISHED'
          import json
          from pathlib import Path
          image=Path('CANDIDATE_IMAGE_ID.txt').read_text().strip()
          row=json.loads(Path('published-image-inspect.json').read_bytes())[0]
          assert row['Id']==image
          refs=[r for r in row['RepoDigests'] if r.startswith('ghcr.io/kouzhizhuo/agenthon-t1@sha256:')]
          assert len(refs)==1
          Path('PUBLISHED_CANDIDATE.json').write_text(json.dumps({'image':refs[0],'image_id':image,
              'installed24_actual_numerics':True,'full23_checks':388,'fresh_CLI_processes':3,
              'House_quality_established':False,'official_submission':False})+'\n')
          PY_PUBLISHED
      - name: Preserve partial evidence after exact container settlement
        if: always()
        run: |
          set -euo pipefail
          if [ -e smoke-output ]; then
            sudo python3 -I -S -B "$PWD/bundle/verification/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase always --container-name "t1-reachable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Save provenance and all mechanics evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t1-budget-reachable-installed-linux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            bundle/provenance
            ROOT_DISPATCH_ATTESTATION.json
            base-pull.txt
            build.txt
            candidate-image-inspect.json
            candidate-config-receipt.json
            CANDIDATE_IMAGE_ID.txt
            installed-source-runtime.json
            smoke-container-id.txt
            smoke-container-inspect.json
            smoke-container-stdout.txt
            smoke-container-stderr.txt
            smoke-output
            smoke-evidence-*.json
            smoke-summary.json
            registry-push.txt
            published-image-inspect.json
            PUBLISHED_CANDIDATE.json
