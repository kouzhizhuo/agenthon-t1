name: T1 budget reachable exact Linux installed numeric fullCLI controls
on:
  workflow_dispatch:
    inputs:
      independent_review_sha256:
        description: Root verified exact author-disjoint workflow review digest
        required: true
        type: string
      publish_candidate:
        description: Root separately authorizes publication of the same verified image
        required: true
        type: boolean
        default: false
