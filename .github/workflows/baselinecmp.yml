name: T3 organizer baseline image vs v11m in-image fallback on the same amd64 runner (routed NaN/huge-size cases)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/baselinecmp.yml
      - t3fastsim_verify/baseline_cmp.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cmp:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST_V11M: sha256:c694767d68a60f2ed2e8eb22037ab52d8aa42c26ceb8e63fb1cf8df498bb41cf
      TRACK_REPO: https://github.com/Agenthon-2026/track3-simulation-public.git
      TRACK_COMMIT: 1d7e994761f2e9256dd0c572c3592422c8fd0914
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'
      - run: python -m pip install numpy pyarrow
      - name: Build the organizer baseline image (public track repo at the pinned commit, linux/amd64)
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet "$TRACK_REPO" track
          git -C track checkout --quiet "$TRACK_COMMIT"
          docker build --platform=linux/amd64 -t track3-abides-baseline:latest track/baselines/
      - name: Compare
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/baseline_cmp.py --baseline-image track3-abides-baseline:latest --v11m "$IMAGE@$DIGEST_V11M" --out "$PWD/evidence/baseline_cmp.json" || true
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t3-baseline-cmp
          path: |
            evidence/**/*.json
            evidence/**/*.md
            evidence/**/*.txt
          retention-days: 30
          if-no-files-found: error
