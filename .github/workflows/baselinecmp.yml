name: T3 organizer baseline image vs v10m in-image fallback on the same amd64 runner (routed NaN/huge-size cases)
on:
  push:
    branches: [verify-t3-fastsim-dev1011]
    paths:
      - .github/workflows/baselinecmp.yml
      - t3fastsim_verify/baseline_cmp.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cmp:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/kouzhizhuo/agenthon-t3
      DIGEST_V10M: sha256:364bd2574c86fb79f3956872d627a080b5573e3bfacee33ccef6edd2c4c81e86
      TRACK_REPO: https://github.com/Agenthon-2026/track3-simulation-public.git
      TRACK_COMMIT: 1d7e994761f2e9256dd0c572c3592422c8fd0914
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - run: python -m pip install numpy pyarrow
      - name: Build the organizer baseline image (public track repo at the pinned commit, linux/amd64)
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet "$TRACK_REPO" track
          git -C track checkout --quiet "$TRACK_COMMIT"
          docker build --platform=linux/amd64 -t track3-abides-baseline:latest track/baselines/
      - name: Compare
        run: |
          set -uo pipefail
          mkdir -p evidence
          python t3fastsim_verify/baseline_cmp.py --baseline-image track3-abides-baseline:latest --v10m "$IMAGE@$DIGEST_V10M" --out "$PWD/evidence/baseline_cmp.json" || true
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-baseline-cmp
          path: evidence
          retention-days: 30
          if-no-files-found: error
