# SPDX-License-Identifier: Apache-2.0
name: T1 V5 exact published digest full regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materialize frozen V5 source
        run: |
          python3 - <<'PY_SOURCE'
          import base64,gzip,json,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='54107bb59b174aeed5f084b76c5200bd5b5e1ce4e66883ac19653282b2128d1f'
          for name,source in json.loads(raw).items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(source)
          PY_SOURCE
      - name: Pull exact published V5 digest anonymously
        run: |
          mkdir -p artifacts
          IMAGE="ghcr.io/kouzhizhuo/agenthon-t1@sha256:d2131d2ac57e296a85764b398cc5a55b53a872ffd801e6fb4e980b8669dfc8c3"
          mkdir -p artifacts/anonymous-docker-config
          DOCKER_CONFIG="$PWD/artifacts/anonymous-docker-config" docker pull --platform linux/amd64 "$IMAGE" > artifacts/anonymous-pull.txt 2>&1
          docker tag "$IMAGE" t1-task-first:candidate
          docker image inspect t1-task-first:candidate > artifacts/image-inspect.json
          python3 verification/verify_image.py artifacts/image-inspect.json > artifacts/image-contract.json
      - name: Verify exact installed runtime
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" --entrypoint python t1-task-first:candidate -B /verification/verify_runtime.py > artifacts/runtime.json 2>&1
      - name: Actual HTTP, process and supervisor regressions
        run: |
          mkdir -p artifacts/test-context
          cp verification/Test.Dockerfile artifacts/test-context/Dockerfile
          cp -r tests artifacts/test-context/tests
          docker build --network none --pull=false -t t1-task-first:tests artifacts/test-context > artifacts/test-build.txt 2>&1
          timeout --kill-after=5s 300s docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --entrypoint python t1-task-first:tests -B -m unittest discover -s /agent/tests -v > artifacts/test-linux.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-release-verify-v5-${{ github.run_id }}
          path: artifacts/
