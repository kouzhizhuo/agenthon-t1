name: Verify frozen Track 2, 3 and 4 images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Pull immutable published images
        run: |
          docker pull ghcr.io/kouzhizhuo/agenthon-t2@sha256:a74cdd6d29b174144fd3e8a0a9aa3492d9d1228e4301d6ad74a835648e323092
          docker pull ghcr.io/kouzhizhuo/agenthon-t3@sha256:5a190afe0bdfe7685e64cbf1aec30d39885199c85f688a971b8d4a0ab8d217eb
          docker pull ghcr.io/kouzhizhuo/agenthon-t4@sha256:5e7c3c40d8af3bdb716b0b0225befeca6cd4dc24e48630b588c74636ce4573c6
      - name: Track 2 synthetic runtime and seed determinism
        run: |
          set -euo pipefail
          mkdir t2input t2output
          chmod 777 t2output
          cat > t2input/smoke.py <<'PY'
          import json,os,pathlib,subprocess,sys
          import numpy as np,pandas as pd
          root=pathlib.Path(os.environ.get('T2_SMOKE_ROOT','/output'))
          solver=os.environ.get('T2_SMOKE_SOLVER','/app/forecast.py')
          os.environ['QFBENCH_SEED']='7'
          checked=[]
          for kind in ['daily_returns','monthly_levels']:
              unit=root/kind;panels=unit/'panels';text=unit/'text'
              panels.mkdir(parents=True);text.mkdir()
              rng=np.random.default_rng(13)
              assets=['A','B'];horizons=[1,5,20] if kind=='daily_returns' else [3,4]
              dates=pd.bdate_range('2024-01-01',periods=320) if kind=='daily_returns' else pd.date_range('2016-01-01',periods=96,freq='MS')
              asof=str(dates[-1].date()) if kind=='daily_returns' else str((dates[-1]+pd.offsets.MonthBegin(2)+pd.Timedelta(days=4)).date())
              target='log_return' if kind=='daily_returns' else 'level'
              panel_id='factors_daily' if kind=='daily_returns' else 'macro_monthly'
              rows=[]
              for asset,scale in zip(assets,[.01,.015]):
                  values=rng.normal(0,scale,len(dates))
                  if kind=='monthly_levels':values=100+np.cumsum(values+.2)
                  rows.append(pd.DataFrame({'date':dates,'asset':asset,'value':values,'panel_id':panel_id}))
              pd.concat(rows,ignore_index=True).to_parquet(panels/(panel_id+'.parquet'),index=False)
              card='schema_version = "2.0"\n[task]\nid = "t2-SMOKE-'+kind+'"\ntrack = "forecasting"\n[provenance]\ndata_cutoff = "'+asof+'"\n[targets]\nasset_ids = ["A", "B"]\nhorizons = '+json.dumps(horizons)+'\ntarget_type = "'+target+'"\n[scoring.params]\nn_draws_min = 200\n'
              (unit/'card.toml').write_text(card)
              spec={'targets':{'asset_ids':assets,'horizons':horizons,'target_type':target}}
              if kind=='monthly_levels':spec['targets']['observation_periods']=[str(dates[-1].to_period('M')+5),str(dates[-1].to_period('M')+6)]
              (unit/'forecast_spec.json').write_text(json.dumps(spec))
              (text/'note.txt').write_text('Synthetic history is known at the stated cutoff.')
              (text/'corpus_index.json').write_text(json.dumps({'documents':[{'doc_id':'smoke','timestamp':asof,'file':'note.txt'}]}))
              for name in ['one','two']:
                  subprocess.run([sys.executable,solver,'forecast','--panels',str(panels),'--text',str(text),'--asof',asof,'--out',str(unit/name/'forecast.parquet')],check=True)
              files={p.name for p in (unit/'one').iterdir() if not p.name.startswith('._')}
              assert files=={'forecast.parquet','forecast_meta.json','forecast_rationale.md'},files
              for name in files:assert (unit/'one'/name).read_bytes()==(unit/'two'/name).read_bytes(),name
              frame=pd.read_parquet(unit/'one/forecast.parquet')
              assert list(frame.columns)==['draw','asset','horizon','value']
              assert len(frame)==1000*len(assets)*len(horizons) and np.isfinite(frame.value).all()
              assert not frame.duplicated(['draw','asset','horizon']).any()
              assert set(frame.asset)==set(assets) and set(frame.horizon)==set(horizons)
              assert set(frame.draw)==set(range(1000))
              meta=json.loads((unit/'one/forecast_meta.json').read_text())
              assert meta['asof']==asof and meta['target']==target and meta['n_draws']==1000
              evidence=json.loads((unit/'one/forecast_rationale.md').read_text().split('```json\n',1)[1].split('\n```',1)[0])
              assert evidence['variant']=='pool_numeric' and evidence['seed']==7
              assert all(evidence['executed_internal_checks'][key] for key in ['target_histories_at_or_before_asof','indexed_documents_at_or_before_asof','all_values_finite'])
              if kind=='monthly_levels':assert evidence['effective_panel_steps']=={'A':[5,6],'B':[5,6]}
              else:assert evidence['stats']['A']['mode']=='cumulative_return' and evidence['return_transform'].startswith('log1p')
              checked.append({'fixture':kind,'rows':len(frame),'seed_bytes_equal':True,'files':sorted(files)})
          sandbox=os.getuid()==65534
          if not os.environ.get('T2_SMOKE_LOCAL'):assert sandbox
          print({'linux_sandbox':sys.platform.startswith('linux') and sandbox,'native_local_check':bool(os.environ.get('T2_SMOKE_LOCAL')),'fixtures':checked})
          PY
          docker run --rm --network none --read-only --user 65534:65534 --cpus 4 --memory 4g --pids-limit 256 --ulimit nofile=1024:1024 --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$PWD/t2input:/input:ro" -v "$PWD/t2output:/output" --entrypoint /usr/local/bin/python ghcr.io/kouzhizhuo/agenthon-t2@sha256:a74cdd6d29b174144fd3e8a0a9aa3492d9d1228e4301d6ad74a835648e323092 /input/smoke.py
      - name: Track 3 sandbox and paired reproducibility
        run: |
          set -euo pipefail
          mkdir input output
          chmod 777 output
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Agenthon-2026/track3-simulation-public/a0fe499dc2d7def72aa53bd4d373cdbd43ef18a7/units/t3-stp-cancel-newest/scenario.json --output input/scenario.json
          echo '42d8f6f9e6413d4bc02949d5dfec2a2ef0f181a10eb9984108859a43a6d80c1b  input/scenario.json' | sha256sum --check
          for mode in baseline optimized; do
            mkdir "output/$mode"
            chmod 777 "output/$mode"
            docker run --rm --network none --read-only --user 65534:65534 --cpus 4 --memory 16g --pids-limit 256 --ulimit nofile=1024:1024 --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$PWD/input:/input:ro" -v "$PWD/output/$mode:/output" ghcr.io/kouzhizhuo/agenthon-t3@sha256:5a190afe0bdfe7685e64cbf1aec30d39885199c85f688a971b8d4a0ab8d217eb simulate --config /input/scenario.json --out /output/trace.parquet --mode "$mode"
          done
          cmp output/baseline/trace.parquet output/optimized/trace.parquet
          cmp output/baseline/message_trace.parquet output/optimized/message_trace.parquet
          python3 - <<'PY'
          import json, pathlib
          base=json.loads(pathlib.Path('output/baseline/events.json').read_text())
          opt=json.loads(pathlib.Path('output/optimized/events.json').read_text())
          assert base['n_events']==opt['n_events'] and base['n_events']>0
          print({'paired_bytes_equal':True,'events':opt['n_events'],'speed_ratio':base['wall_clock_sec']/opt['wall_clock_sec']})
          PY
      - name: Track 4 sandbox and authenticated synthetic House generation
        run: |
          set -euo pipefail
          mkdir t4input t4output
          chmod 777 t4output
          cat > t4input/smoke.py <<'PY'
          import hashlib,http.server,json,os,pathlib,subprocess,sys,threading
          root=pathlib.Path(os.environ.get('T4_SMOKE_ROOT','/output'))
          solver=os.environ.get('T4_SMOKE_SOLVER','/app/house_analyze.py')
          labels=['hold-steady','fall','rise']
          fixtures={}; calls={}; failures=[]; checked=[]
          for kind,size,level in [('regression',30,.8),('classification',5,.95)]:
              unit=root/kind;corpus=unit/'corpus';corpus.mkdir(parents=True)
              entities=[{'entity_id':kind[0].upper()+str(i).zfill(2),'name':'Synthetic '+kind+' '+str(i)} for i in range(size)]
              texts={};entries=[];expected={}
              for i,entity in enumerate(entities):
                  eid=entity['entity_id'];text=entity['name']+' measurement rose from 1 to 2 before cutoff.'
                  texts[eid]=text
                  doc=json.dumps({'doc_id':eid,'doc_date':'2024-01-01','title':entity['name']+' measurement','text':text}).encode()
                  (corpus/(eid+'.json')).write_bytes(doc)
                  entries.append({'path':'corpus/'+eid+'.json','role':'corpus','sha256':hashlib.sha256(doc).hexdigest(),'entity_ids':[eid]})
                  point,lo,hi=(i+.75,i+.25,i+1.25) if kind=='regression' else (.6,.3,.9)
                  value={'entity_id':eid,'point_forecast':point,'lo':lo,'hi':hi,'reason':{'premise':text,'mechanism':'Persistence can support gradual growth with broad uncertainty.','answer_implication':entity['name']+' future measurement is estimated at '+str(point)+'.'}}
                  if kind=='classification':value['label']=labels[i%len(labels)]
                  expected[eid]=value
              target={'type':kind,'name':'measurement'}
              if kind=='classification':target['labels']=labels
              task={'task_id':'synthetic-'+kind,'target':target,'cutoff_date':'2024-01-31','interval_level':level,'entities':entities,'prompt':'Predict future measurement using the frozen pre-cutoff evidence.'}
              (unit/'manifest.json').write_text(json.dumps({'files':entries}))
              (unit/'task.json').write_text(json.dumps(task))
              fixtures[task['task_id']]={'unit':unit,'task':task,'texts':texts,'expected':expected}
              calls[task['task_id']]=[]
          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self,*args): pass
              def do_POST(self):
                  try:
                      assert self.path=='/v1/chat/completions'
                      assert self.headers['Authorization']=='Bearer synthetic-runtime'
                      payload=json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                      assert payload['model']=='synthetic-house' and 0<payload['max_tokens']<=4000
                      prompt,_=json.JSONDecoder().raw_decode(payload['messages'][-1]['content'].lstrip())
                      task_id=prompt['task']['task_id'];fixture=fixtures[task_id];task=fixture['task'];contract=prompt['contract']
                      assert contract['target_type']==task['target']['type']
                      assert contract['labels']==task['target'].get('labels',[])
                      assert contract['interval_level']==task['interval_level']
                      batch=prompt['entities'];ids=[item['entity']['entity_id'] for item in batch]
                      assert 1<=len(ids)<=4 and len(set(ids))==len(ids)
                      assert all(eid in fixture['expected'] for eid in ids)
                      for item in batch:
                          eid=item['entity']['entity_id'];spans=item['frozen_evidence'];assert spans
                          for span in spans:
                              assert span['doc_id']==eid
                              assert fixture['texts'][eid][span['span_start']:span['span_end']]==span['text']
                      calls[task_id].append(ids);assert len(calls[task_id])<=25
                      predictions=[fixture['expected'][eid] for eid in reversed(ids)]
                      if task['target']['type']=='regression' and len(calls[task_id])==1:
                          predictions=predictions[:-1]
                      value={'entity_predictions':predictions}
                      body=json.dumps({'choices':[{'message':{'content':json.dumps(value)}}]}).encode()
                      self.send_response(200)
                  except Exception as exc:
                      failures.append(repr(exc));body=json.dumps({'error':repr(exc)}).encode();self.send_response(500)
                  self.send_header('Content-Type','application/json');self.end_headers();self.wfile.write(body)
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          os.environ.update(MODEL_ENDPOINT='http://127.0.0.1:'+str(server.server_port),MODEL_NAME='synthetic-house',MODEL_TOKEN='synthetic-runtime')
          try:
              for task_id,fixture in fixtures.items():
                  unit=fixture['unit'];task=fixture['task']
                  subprocess.run([sys.executable,solver,'analyze','--task',str(unit/'task.json'),'--corpus',str(unit/'corpus'),'--out',str(unit/'answer.json')],check=True,timeout=120)
                  assert not failures,failures
                  answer=json.loads((unit/'answer.json').read_text());rows=answer['entity_predictions']
                  roster=[entity['entity_id'] for entity in task['entities']]
                  assert answer['task_id']==task_id and answer['target_type']==task['target']['type']
                  assert [row['entity_id'] for row in rows]==roster
                  request_count=len(calls[task_id]);assert request_count<=25
                  assert answer['notes']['house_requests']==request_count
                  if task['target']['type']=='regression':
                      assert request_count==9 and calls[task_id][0]==calls[task_id][1]
                      assert [eid for batch in calls[task_id][1:] for eid in batch]==roster
                  else:
                      assert request_count==2 and [eid for batch in calls[task_id] for eid in batch]==roster
                  for row in rows:
                      eid=row['entity_id'];expected=fixture['expected'][eid]
                      assert row['point_forecast']==expected['point_forecast']
                      assert row['interval']=={'level':task['interval_level'],'lo':expected['lo'],'hi':expected['hi']}
                      if task['target']['type']=='classification':assert row['label']==expected['label']
                      assert row['claims']
                      for claim in row['claims']:
                          assert claim['doc_id']==eid and claim['claim']
                          assert fixture['texts'][eid][claim['span_start']:claim['span_end']]==claim['claim']
                  checked.append({'fixture':task['target']['type'],'entities':len(rows),'interval_level':task['interval_level'],'authenticated_requests':request_count,'repair_used':request_count==9,'quotes_exact':True,'task_order_exact':True})
              sandbox=os.getuid()==65534
              if not os.environ.get('T4_SMOKE_LOCAL'):assert sandbox and sys.platform.startswith('linux')
              print(json.dumps({'linux_sandbox':sys.platform.startswith('linux') and sandbox,'native_local_check':bool(os.environ.get('T4_SMOKE_LOCAL')),'fixtures':checked,'live_house_quality':'NOT_RUN'}))
          finally:server.shutdown();server.server_close()
          PY
          docker run --rm --network none --read-only --user 65534:65534 --cpus 4 --memory 4g --pids-limit 256 --ulimit nofile=1024:1024 --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$PWD/t4input:/input:ro" -v "$PWD/t4output:/output" --entrypoint /usr/local/bin/python ghcr.io/kouzhizhuo/agenthon-t4@sha256:5e7c3c40d8af3bdb716b0b0225befeca6cd4dc24e48630b588c74636ce4573c6 /input/smoke.py
      - name: Record validation scope
        run: |
          printf 'Linux sandbox smoke passed. T3 paired trace bytes match. T4 uses an authenticated synthetic House server. Official quality and controlled timing remain unmeasured.\n' >> "$GITHUB_STEP_SUMMARY"
