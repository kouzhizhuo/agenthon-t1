name: T1 V26 model I/O and whole-task Linux verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Materialize exact frozen V26 source and verify every file
        run: |
          mkdir -p candidate
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,io,json,stat,tarfile
          from pathlib import Path,PurePosixPath
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='3a6dd357c7c4fd461b8b24b7df53747791b40d43a6da5ac3a223ad5bc0928ccb'
          descriptor=json.loads(gzip.decompress(base64.b64decode('',validate=True)))
          assert descriptor['source_commit']=='1e883614899d726db43bee318366b0383bb72a70'
          assert descriptor['bundle_sha256']==hashlib.sha256(raw).hexdigest()
          expected={row['path']:row for row in descriptor['files']}
          assert len(expected)==descriptor['source_file_count']
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              members=archive.getmembers()
              assert len(members)==len(expected) and len({member.name for member in members})==len(members)
              for member in members:
                  path=PurePosixPath(member.name)
                  assert member.isfile() and member.name in expected and not path.is_absolute()
                  assert path.as_posix()==member.name and '..' not in path.parts
                  assert not any(part.startswith('._') or part in ('__pycache__','.git','artifacts') for part in path.parts)
                  assert member.mode==0o444 and member.uid==member.gid==0 and member.mtime==0
                  data=archive.extractfile(member).read()
                  assert len(data)==expected[member.name]['bytes']
                  assert hashlib.sha256(data).hexdigest()==expected[member.name]['sha256']
              archive.extractall('candidate',filter='data')
          actual={path.relative_to('candidate').as_posix():path for path in Path('candidate').rglob('*') if path.is_file()}
          assert actual.keys()==expected.keys()
          for name,path in actual.items():
              assert not path.is_symlink() and path.stat().st_size==expected[name]['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected[name]['sha256']
          Path('candidate/artifacts').mkdir()
          Path('candidate/artifacts/source-freeze.json').write_text(json.dumps(descriptor,indent=2)+'\n')
          PYCODE
      - name: Build exact Linux production image
        run: |
          cd candidate
          docker build --platform linux/amd64 --network none --pull=false -t t1-task-first:candidate . > artifacts/build.txt 2>&1
          docker image inspect t1-task-first:candidate > artifacts/image-inspect.json
          python3 verification/verify_image.py artifacts/image-inspect.json > artifacts/image-contract.json
      - name: Verify installed source closure
        run: |
          cd candidate
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" --entrypoint python t1-task-first:candidate -B /verification/verify_runtime.py > artifacts/runtime.json 2>&1
      - name: Offline sklearn exact image dependency and fit probes
        run: |
          cd candidate
          python3 - <<'PY_SKLEARN'
          import base64,hashlib
          from pathlib import Path
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='1e3dd2b5631becb3f3820b6f8c48a38c3356941ffe0000fb3a3185242007481a'
          Path('artifacts/offline_sklearn_probe.py').write_bytes(raw)
          PY_SKLEARN
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/artifacts/offline_sklearn_probe.py:/verification/offline_sklearn_probe.py:ro" --entrypoint python t1-task-first:candidate -B /verification/offline_sklearn_probe.py > artifacts/sklearn-probe.json 2>&1
      - name: Production CLI on readonly input and mounted output
        run: |
          cd candidate
          python3 verification/production_smoke.py prepare --task-dir artifacts/smoke-input
          mkdir -p artifacts/smoke-output
          chmod -R a+rX artifacts/smoke-input
          chmod 0777 artifacts/smoke-output
          docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" -v "$PWD/artifacts/smoke-input:/input:ro" -v "$PWD/artifacts/smoke-output:/output:rw" -v "$PWD/artifacts/smoke-output:/app/output:rw" --entrypoint python t1-task-first:candidate -B /verification/production_smoke.py run > artifacts/production-smoke.json 2>&1
      - name: Whole controller, HTTP and Linux lifecycle regression
        run: |
          cd candidate
          mkdir -p artifacts/test-context
          cp verification/Test.Dockerfile artifacts/test-context/Dockerfile
          cp -r tests artifacts/test-context/tests
          docker build --network none --pull=false -t t1-task-first:tests artifacts/test-context > artifacts/test-build.txt 2>&1
          timeout --kill-after=5s 300s docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --entrypoint python t1-task-first:tests -B -m unittest discover -s /agent/tests -v > artifacts/test-linux.txt 2>&1
      - name: Require exact frozen test identities and zero skips
        run: |
          cd candidate
          python3 - <<'PY_ROSTER'
          import ast,hashlib,json,re
          from pathlib import Path
          descriptor=json.loads(Path('artifacts/source-freeze.json').read_text())
          expected=[]
          for path in sorted(Path('tests').glob('test_*.py')):
              for cls in ast.parse(path.read_text()).body:
                  if isinstance(cls,ast.ClassDef):
                      expected.extend(path.stem+'.'+cls.name+'.'+fn.name for fn in cls.body
                          if isinstance(fn,ast.FunctionDef) and fn.name.startswith('test_'))
          assert len(expected)==len(set(expected))==descriptor['test_count']
          assert sorted(expected)==descriptor['test_roster']
          assert hashlib.sha256('\n'.join(sorted(expected)).encode()).hexdigest()==descriptor['test_roster_sha256']
          log=Path('artifacts/test-linux.txt').read_text()
          passed=re.findall(r'^test_\w+ \(([^)]+)\) \.\.\. ok$',log,re.M)
          assert len(passed)==len(set(passed))==descriptor['test_count'] and set(passed)==set(expected)
          assert re.search(rf'\nRan {descriptor["test_count"]} tests in [0-9.]+s\n\nOK\n\s*\Z',log)
          assert 'skipped' not in log
          Path('artifacts/test-roster-verified.txt').write_text(f'{descriptor["test_count"]} exact frozen identities; zero skips\n')
          PY_ROSTER
      - name: Offline installed streaming-window resource measurement
        run: |
          cd candidate
          python3 - <<'PY_STREAM'
          import base64,gzip,hashlib,json
          from pathlib import Path
          compressed=base64.b64decode('')
          assert len(compressed)==3039 and hashlib.sha256(compressed).hexdigest()=='ff2aa818d467e058d5476e5e7adf2964d02879bf9b77c8b3d2c401e42b51a58a'
          probe=gzip.decompress(compressed)
          assert len(probe)==7613 and hashlib.sha256(probe).hexdigest()=='748a99e008feedd0a411bf2dc53efb67f62d9d86f5836a4fe2d453464bd330e0'
          source=Path('artifacts/offline_stream_linux_probe.py');source.write_bytes(probe);source.chmod(0o444)
          configuration=(json.dumps({'seed': 77119, 'rows': 2515, 'features': 4, 'targets': 10, 'window': 252},separators=(',',':'))+'\n').encode()
          assert hashlib.sha256(configuration).hexdigest()=='842f587c33144834f2880aca2d93b686ca3a2bd3d05bf163ab4ca1b03c221199'
          input_file=Path('artifacts/stream-probe-input.json');input_file.write_bytes(configuration);input_file.chmod(0o444)
          output=Path('artifacts/stream-probe-output');output.mkdir();output.chmod(0o777)
          PY_STREAM
          timeout --kill-after=5s 210s docker run --rm --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=4 --memory=4g --memory-swap=4g --pids-limit=256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -v "$PWD/verification:/verification:ro" -v "$PWD/artifacts/offline_stream_linux_probe.py:/resource/probe.py:ro" -v "$PWD/artifacts/stream-probe-input.json:/resource/input.json:ro" -v "$PWD/artifacts/stream-probe-output:/resource/output:rw" --entrypoint python t1-task-first:candidate -B /resource/probe.py --input /resource/input.json --out /resource/output/stream-linear-resource.json > artifacts/stream-probe-summary.json 2> artifacts/stream-probe-stderr.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-segmented-final-v26-${{ github.run_id }}
          path: candidate/artifacts/
