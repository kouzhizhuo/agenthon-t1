name: T1 audit3000 exact installed Linux build and smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  current22-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_IMAGE: ghcr.io/kouzhizhuo/agenthon-t1@sha256:05a21c296caecd021af1b59e2b9c7c36bd4ef22ce46cea796afdc0a3c758a53c
      IMAGE_NAME: ghcr.io/kouzhizhuo/agenthon-t1
    steps:
      - name: Materialize exact reviewed bundle
        run: |
          set -euo pipefail
          python3 - <<'PY_BUNDLE'
          import base64, hashlib, json
          from pathlib import Path
          payload = json.loads('{"Dockerfile":"","agent/LICENSE":"","agent/agents/vsa_agent.py":"","agent/qfbagent/__init__.py":"IiIiVHJhY2sgMSBhZ2VudCBmb3IgQWdlbnRob24gMjAyNiAoUUZCZW5jaCAyLjApLiIiIgoKX192ZXJzaW9uX18gPSAiMC4xLjAiCg==","agent/qfbagent/agent.py":"","agent/qfbagent/checkpoints.py":"","agent/qfbagent/config.py":"","agent/qfbagent/contract.py":"","agent/qfbagent/execute.py":"","agent/qfbagent/execution_receipts.py":"","agent/qfbagent/inspect_data.py":"","agent/qfbagent/invariants.py":"","agent/qfbagent/ledger.py":"","agent/qfbagent/llm.py":"","agent/qfbagent/method_memory.py":"","agent/qfbagent/numerics.py":"","agent/qfbagent/output_tree.py":"","agent/qfbagent/receipt_io.py":"","agent/qfbagent/report.py":"","agent/qfbagent/spec_ledger.py":"","agent/qfbagent/staged.py":"","agent/qfbagent/task.py":"","agent/qfbagent/verify.py":"","verification/CANDIDATE_HASHES.json":"","verification/linux_fixture.py":"","verification/readiness.py":"","verification/verify_installed.py":""}')
          expected = json.loads('{"Dockerfile":{"bytes":412,"sha256":"8855fc4dba072a06b87f502f0f9ed2497f6945fa084eedc1089cae68e1d1e2ac"},"agent/LICENSE":{"bytes":649,"sha256":"37b81f72f42ede4f22dc024f666ae84354574a5580d30771adfd0ae23a2c761f"},"agent/agents/vsa_agent.py":{"bytes":2453,"sha256":"96ae45fea857263517ab90ff138d80b10192fb37342b6454c8c9ce58cb7dc424"},"agent/qfbagent/__init__.py":{"bytes":76,"sha256":"6c655c51ee939291b49f766090055045dd7511d81adccae21e1a10bc9a1d9b1f"},"agent/qfbagent/agent.py":{"bytes":39120,"sha256":"8117b6af10702d2cc1265a755e5cc335b26c8ab70d7add6989525fcd6b700a5f"},"agent/qfbagent/checkpoints.py":{"bytes":19087,"sha256":"88a9a8c38de59c7499b0bc4841b06bf52e3dc50d2a56a7448aa349c9a676834b"},"agent/qfbagent/config.py":{"bytes":7738,"sha256":"a16b4cdfe371c4b00222d9b24b96b0965712e98fa0337233746ce42f5feb56f9"},"agent/qfbagent/contract.py":{"bytes":29948,"sha256":"428b108d018f4100cae3f5ce01e1ce365acb4f3b234823f9aa65d0f1ababe58d"},"agent/qfbagent/execute.py":{"bytes":8728,"sha256":"e98eb871f095b2a17b2ea14e511fcd29b29146518da217a413ca3584d0524323"},"agent/qfbagent/execution_receipts.py":{"bytes":6325,"sha256":"909dd4e00e46bb11cde705a11632043629a44914ade89072ebd44f316c33bec7"},"agent/qfbagent/inspect_data.py":{"bytes":30381,"sha256":"c304203bd0182c0225d591a97fe0aee4f58a07c9d4967c6181e1107c069b3539"},"agent/qfbagent/invariants.py":{"bytes":21881,"sha256":"eec3486db0d54b0d61619c7fca08ab05c09e8c18af4d274efb0cc153c3f78b4d"},"agent/qfbagent/ledger.py":{"bytes":21323,"sha256":"fe2e1b046ab18210a0b104e13c1764d8e2610909edb8369eb4145b881f07f2f7"},"agent/qfbagent/llm.py":{"bytes":63024,"sha256":"6ed92326615a62ff385ba5f94fe3240d14b0a1b656df95a1b49e2ab22d3a8a76"},"agent/qfbagent/method_memory.py":{"bytes":2818,"sha256":"fe376f0f6fdfdd861d0905fe417da7642f945e508d76dcb2850ee8036cdc2484"},"agent/qfbagent/numerics.py":{"bytes":9349,"sha256":"6ee32a71debe5908b704ea1806f015efa49075cafbe3497aa1f0edec06764702"},"agent/qfbagent/output_tree.py":{"bytes":29946,"sha256":"e931106a65c63e9cdc1fac1346f81decc6677e1b9d8bd0adb95b4672063d4dc5"},"agent/qfbagent/receipt_io.py":{"bytes":5982,"sha256":"c2c70e5155bb2f61535525d7b36a3f25240da63172b60efc44fa30c51eb6971c"},"agent/qfbagent/report.py":{"bytes":67173,"sha256":"e7acd0c61a0d28a7ad0524e2a15c3e1b18858811d7124451a8360368f301cd0b"},"agent/qfbagent/spec_ledger.py":{"bytes":3053,"sha256":"5f329beb392b919ae6f627ca71bb1d2141710f8dbe08b43ac653afe17ae58391"},"agent/qfbagent/staged.py":{"bytes":32179,"sha256":"493b14513e999d74f27ff9c6e8ba4956d07efe0db575c5f87c14845681c64a38"},"agent/qfbagent/task.py":{"bytes":7390,"sha256":"814395af0f75b904e21c0b7941aed8ddb733cd2e0f4b2296380e829890e8dfaa"},"agent/qfbagent/verify.py":{"bytes":13186,"sha256":"47bffdd88ba503a16cb5283cc4880d3e20295a8def6460b643fc374ebf8f9339"},"verification/CANDIDATE_HASHES.json":{"bytes":2066,"sha256":"09cc5a638d0e3af5ff607509025d810776c165c3a8e7559574be37fcd920156e"},"verification/linux_fixture.py":{"bytes":19607,"sha256":"69267482b9c30bc5671c6d4d4755baa424b2b0ab6741b0fe711adbebf83e9b22"},"verification/readiness.py":{"bytes":2900,"sha256":"0cb0f37c8f10856a421f8a5fb04745b753c39e7bf08c7c94ce833ca47195c547"},"verification/verify_installed.py":{"bytes":1943,"sha256":"4b64df395838ac5c35e42fbebcc42b6fa8105f762fdd93c277f704a4a0914cf7"}}')
          root = Path('bundle')
          root.mkdir()
          assert set(payload) == set(expected) and len(payload) == 27
          for relative in sorted(payload):
              path = root / relative
              assert not Path(relative).is_absolute() and '..' not in Path(relative).parts
              raw = base64.b64decode(payload[relative], validate=True)
              assert len(raw) == expected[relative]['bytes'] and hashlib.sha256(raw).hexdigest() == expected[relative]['sha256']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              path.chmod(0o444)
          print(json.dumps({'materialized_primary_agent_files': 22, 'bundle_files': 27, 'runtime_executed': False}))
          PY_BUNDLE
      - name: Build exact candidate image
        run: |
          set -euo pipefail
          mkdir anonymous-docker-config
          export DOCKER_CONFIG="$PWD/anonymous-docker-config"
          timeout --kill-after=10s 300s docker pull "$BASE_IMAGE"
          timeout --kill-after=10s 300s docker build --platform linux/amd64 --pull=false --tag t1-audit3000:candidate bundle
          docker image inspect t1-audit3000:candidate > candidate-image-inspect.json
          python3 bundle/verification/verify_installed.py --image candidate-image-inspect.json > candidate-config-receipt.json
          python3 bundle/verification/linux_fixture.py --verify-image candidate-image-inspect.json > production-runtime-env-receipt.json
      - name: Verify actual installed source and runtime
        run: |
          set -euo pipefail
          timeout --kill-after=10s 90s docker run --rm --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges -v "$PWD/bundle/verification:/verification:ro" --entrypoint python t1-audit3000:candidate /verification/verify_installed.py > installed-source-runtime.json
          python3 bundle/verification/linux_fixture.py --prepare smoke
          cp candidate-image-inspect.json smoke/input/image_inspect.json
      - name: Three invented real CLI mechanics cases
        run: |
          set -euo pipefail
          trap 'for case in authenticated_entrypoint diagnostic_recovery failed_audit_child; do docker rm -f "t1-audit3000-$case" >/dev/null 2>&1 || true; done' EXIT
          for case in authenticated_entrypoint diagnostic_recovery failed_audit_child; do
            timeout --kill-after=10s 240s docker run --rm --name "t1-audit3000-$case" --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cpus 4 --memory 4g --memory-swap 4g --pids-limit 256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$PWD/bundle/verification:/fixture:ro" -v "$PWD/smoke/input:/input:ro" -v "$PWD/smoke/output:/app/output" --entrypoint /usr/local/bin/python t1-audit3000:candidate /fixture/linux_fixture.py --case "$case"
          done
          python3 bundle/verification/readiness.py summarize smoke/output
          cat smoke/output/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified candidate to personal registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u kouzhizhuo --password-stdin
          TAG="audit3000-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag t1-audit3000:candidate "$IMAGE_NAME:$TAG"
          timeout --kill-after=10s 300s docker push "$IMAGE_NAME:$TAG" > registry-push.txt
          docker image inspect "$IMAGE_NAME:$TAG" > published-image-inspect.json
          python3 - <<'PY_RECEIPT'
          import json, os
          from pathlib import Path
          row = json.loads(Path('published-image-inspect.json').read_text())[0]
          refs = [r for r in row['RepoDigests'] if r.startswith('ghcr.io/kouzhizhuo/agenthon-t1@sha256:')]
          assert len(refs) == 1
          Path('PUBLISHED_CANDIDATE.json').write_text(json.dumps({'image': refs[0], 'image_id': row['Id'], 'run_id': os.environ['GITHUB_RUN_ID'], 'exact_installed22_verified': True, 'invented_cli_cases_passed': 3, 'genuine_House_prediction_gain': False, 'official_submission': False}, indent=2) + '\n')
          PY_RECEIPT
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t1-audit3000-installed-linux-evidence
          path: |
            candidate-image-inspect.json
            candidate-config-receipt.json
            production-runtime-env-receipt.json
            installed-source-runtime.json
            smoke/output
            registry-push.txt
            published-image-inspect.json
            PUBLISHED_CANDIDATE.json
